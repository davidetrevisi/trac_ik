# This config uses industrial_ci (https://github.com/ros-industrial/industrial_ci.git).
# For troubleshooting, see README (https://github.com/ros-industrial/industrial_ci/blob/master/README.rst)

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # allow manually starting this workflow

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  industrial_ci:
    name: ROS ${{ matrix.ROS_DISTRO }} (${{ matrix.ROS_REPO }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Six cells, all of them required checks. One source tree, three distros, no distro branches.
        include:
          - {ROS_DISTRO: jazzy, ROS_REPO: main, arch: amd64, runner: ubuntu-latest}
          - {ROS_DISTRO: jazzy, ROS_REPO: testing, arch: amd64, runner: ubuntu-latest}
          - {ROS_DISTRO: kilted, ROS_REPO: main, arch: amd64, runner: ubuntu-latest}
          - {ROS_DISTRO: kilted, ROS_REPO: testing, arch: amd64, runner: ubuntu-latest}
          # rolling x main is deliberately absent. It is broken upstream, not by anything here:
          # rolling moved to ubuntu:resolute and that platform's released apt suite is not yet
          # populated, so setup_rosdep fails with "E: Unable to locate package
          # ros-rolling-ros-environment" (traclabs/trac_ik run 32831002211, 2026-08-25, on a commit
          # whose rolling x testing cell passed). Restore this cell when resolute's main suite fills in.
          - {ROS_DISTRO: rolling, ROS_REPO: testing, arch: amd64, runner: ubuntu-latest}
          # Every performance number this fork publishes was measured on a 2-core aarch64 guest, so one
          # cell builds and runs the full suite on aarch64. It does not gate on timing: no test in the
          # suite asserts a duration.
          - {ROS_DISTRO: jazzy, ROS_REPO: main, arch: arm64, runner: ubuntu-24.04-arm}
    env:
      CCACHE_DIR: "${{ github.workspace }}/.ccache" # directory for ccache (and how we enable ccache in industrial_ci)
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ matrix.ROS_DISTRO }}-${{ matrix.ROS_REPO }}-${{ matrix.arch }}-${{github.run_id}}
          restore-keys: |
            ccache-${{ matrix.ROS_DISTRO }}-${{ matrix.ROS_REPO }}-${{ matrix.arch }}-
      - uses: 'ros-industrial/industrial_ci@master'
        env:
          ROS_DISTRO: ${{ matrix.ROS_DISTRO }}
          ROS_REPO: ${{ matrix.ROS_REPO }}
          # colcon test runs and gates on every cell. A shared runner is slower and noisier than the
          # machine the suite's wall-clock bounds were chosen on, so the per-solve budget is loosened
          # here: a slow runner should fail on behaviour, not on wall-clock.
          DOCKER_RUN_OPTS: '-e TRAC_IK_TEST_SOLVE_BUDGET=0.2'
